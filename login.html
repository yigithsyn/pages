<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <script>
        // Apply saved theme early to avoid flash; "auto" follows the browser.
        (function () {
            var t = localStorage.getItem('theme') || 'auto';
            var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>
    <style>
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>

<body class="bg-body-tertiary min-vh-100 d-flex flex-column">
    <nav class="navbar bg-body border-bottom px-3">
        <span class="navbar-brand mb-0 h1">My App</span>
        <div class="dropdown ms-auto">
            <button class="btn btn-outline-secondary dropdown-toggle" id="themeBtn" data-bs-toggle="dropdown"
                aria-expanded="false">
                <span id="themeLabel">Auto</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item theme-opt" data-theme="auto">Auto (browser)</button></li>
                <li><button class="dropdown-item theme-opt" data-theme="light">Light</button></li>
                <li><button class="dropdown-item theme-opt" data-theme="dark">Dark</button></li>
            </ul>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-sm login-card">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">Sign in</h1>
                <div id="alert" class="alert alert-danger d-none" role="alert"></div>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or email</label>
                        <input type="text" class="form-control" id="username" autocomplete="username" required>
                        <div class="invalid-feedback">Please enter your username.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group has-validation">
                            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                            <span class="input-group-text" id="togglePwIcon"><i class="bi bi-eye"></i></span>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        $(function () {
            var mq = matchMedia('(prefers-color-scheme: dark)');
            var labels = { auto: 'Auto', light: 'Light', dark: 'Dark' };

            function applyTheme(t) {
                var dark = t === 'dark' || (t === 'auto' && mq.matches);
                $('html').attr('data-bs-theme', dark ? 'dark' : 'light');
                $('#themeLabel').text(labels[t]);
                $('.theme-opt').removeClass('active').filter('[data-theme="' + t + '"]').addClass('active');
            }

            applyTheme(localStorage.getItem('theme') || 'auto');

            $('.theme-opt').on('click', function () {
                var t = $(this).data('theme');
                if (t === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', t);
                applyTheme(t);
            });

            // React to OS/browser theme changes while in auto mode
            mq.addEventListener('change', function () {
                if (!localStorage.getItem('theme')) applyTheme('auto');
            });

            $('#togglePwIcon').on('click', function () {
                var $pw = $('#password');
                var show = $pw.attr('type') === 'password';
                $pw.attr('type', show ? 'text' : 'password');
                $(this).html(show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>');
            });

            $('#loginForm').on('submit', function (e) {
                e.preventDefault();
                var valid = true;
                $('#username, #password').each(function () {
                    var bad = !$.trim($(this).val());
                    $(this).toggleClass('is-invalid', bad);
                    if (bad) valid = false;
                });
                if (!valid) return;
                // TODO: replace with a real authentication request
                $('#alert').removeClass('d-none').text('Login is not connected to a backend yet.');
            });
        });
    </script>
</body>

</html>
