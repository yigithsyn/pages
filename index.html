<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper V2</title>

    <!-- Apply the saved (or system) color mode before first paint to avoid a flash -->
    <script>
        document.documentElement.dataset.bsTheme = localStorage.getItem("theme")
            || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>

    <!-- Boostrap v6 -->
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        /* Below md the sidebar is a Bootstrap drawer; from md up it is an inline, collapsible column. */
        @media (min-width: 768px) {
            #sidebar {
                position: static;
                display: flex;
                flex-direction: column;
                flex: none;
                width: 17.5rem;
                max-width: none;
                height: auto;
                max-height: none;
                margin: 0;
                visibility: visible;
                transform: none;
                border-width: 0 var(--bs-border-width) 0 0;
                border-radius: 0;
                box-shadow: none;
                transition: width .2s ease;
            }
            #sidebar.sidebar-collapsed { width: 4.5rem; }
            #sidebar.sidebar-collapsed .sidebar-title,
            #sidebar.sidebar-collapsed .sidebar-label,
            #sidebar.sidebar-collapsed .sidebar-user-name { display: none; }
            #sidebar.sidebar-collapsed .sidebar-brand,
            #sidebar.sidebar-collapsed .list-group-item,
            #sidebar.sidebar-collapsed .sidebar-user { justify-content: center; }
            #sidebar.sidebar-collapsed .sidebar-brand { padding-inline: 0; }
            #sidebar.sidebar-collapsed .sidebar-user { padding-inline: 0; }
            #sidebar:not(.sidebar-collapsed) .sidebar-back-btn { display: inline-flex; }
            #sidebar.sidebar-collapsed .sidebar-back-btn { display: none; }
        }

        .sidebar-brand {
            min-height: 4.25rem;
            padding: .75rem 1rem;
        }
        .sidebar-back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            margin-left: auto;
            padding: 0;
            color: var(--bs-emphasis-color);
            background: transparent;
            border: 0;
            border-radius: .5rem;
        }
        .sidebar-back-btn:hover,
        .sidebar-back-btn:focus-visible {
            background-color: var(--bs-secondary-bg);
        }
        .sidebar-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            flex: 0 0 2.25rem;
            color: var(--bs-bg-body);
            background-color: var(--bs-fg-body);
            border: 0;
            border-radius: .375rem;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .sidebar-title {
            color: var(--bs-emphasis-color);
            font-size: 1.5rem;
            font-weight: 400;
            white-space: nowrap;
        }
        .sidebar-nav .list-group-item {
            min-height: 3rem;
            padding: .75rem 1rem;
            border: 0;
            color: var(--bs-emphasis-color);
        }
        .sidebar-nav .list-group-item:hover,
        .sidebar-nav .list-group-item:focus-visible {
            background-color: var(--bs-secondary-bg);
        }
        .sidebar-nav .list-group-item.active {
            color: var(--bs-emphasis-color);
            background-color: var(--bs-tertiary-bg);
        }
        .sidebar-nav .bi {
            width: 1.25rem;
            flex: 0 0 1.25rem;
            text-align: center;
            font-size: 1rem;
        }
        .sidebar-user {
            min-height: 3.5rem;
            padding: .625rem 1rem;
            border-top: var(--bs-border-width) solid var(--bs-border-color);
        }
        .sidebar-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            flex: 0 0 2rem;
            color: var(--bs-body-bg);
            background-color: var(--bs-secondary-color);
            border-radius: 50%;
            font-size: .9rem;
        }
        .sidebar-user-name {
            color: var(--bs-emphasis-color);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Workspace: the page always fits inside the gray area (no overflow) at a 1 : 1.4142 ratio. */
        .workspace {
            --paper-ratio: 1.4142;
            position: relative;
            min-width: 0;
            padding: 1rem 4rem 1rem 1rem;
            container-type: size;
            background-color: var(--bs-bg-4);
        }
        @media (min-width: 768px) {
            .workspace { padding: 1.5rem 4rem; }
        }
        /* Floating page switcher in the right gutter */
        .page-nav {
            position: absolute;
            inset-block: 0;
            inset-inline-end: .5rem;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            pointer-events: none;
        }
        .page-nav > * { pointer-events: auto; }
        .page-nav .btn-solid { box-shadow: var(--bs-box-shadow); }
        .page-counter {
            padding: .125rem .5rem;
            font-size: var(--bs-font-size-sm);
            font-variant-numeric: tabular-nums;
            color: var(--bs-fg-body);
            background-color: var(--bs-bg-body);
            border-radius: 1rem;
            box-shadow: var(--bs-box-shadow);
        }
        .paper {
            width: min(100cqw, 100cqh / var(--paper-ratio));
            aspect-ratio: 1 / var(--paper-ratio);
            box-shadow: var(--bs-box-shadow-lg);
        }
        .paper.landscape {
            width: min(100cqw, 100cqh * var(--paper-ratio));
            aspect-ratio: var(--paper-ratio) / 1;
        }
        .paper { position: relative; overflow: hidden; cursor: text; }

        /* Text boxes: resizable via the bottom-right handle; textarea while editing, rendered HTML otherwise */
        .text-box {
            position: absolute;
            min-width: 3rem;
            min-height: 2rem;
            overflow: hidden;
            cursor: auto;
            border: 1px dashed transparent;
        }
        .text-box:hover,
        .text-box.editing { border-color: var(--bs-border-color); }
        .text-box textarea {
            display: block;
            width: 100%;
            height: 100%;
            padding: .25rem;
            resize: none;
            border: 0;
            outline: 0;
            color: inherit;
            background: transparent;
            font: inherit;
        }
        .text-box .rendered { height: 100%; overflow: auto; padding: .25rem; overflow-wrap: anywhere; }
        .move-handle {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            height: 1.25rem;
            font-size: .75rem;
            cursor: move;
            touch-action: none;
            color: var(--bs-secondary-color);
            background: var(--bs-bg-body);
            border-radius: 0 0 0 .25rem;
            opacity: .45;
            z-index: 1;
        }
        .text-box:hover .move-handle,
        .text-box.editing .move-handle { opacity: .9; }
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 18px;
            height: 18px;
            cursor: nwse-resize;
            touch-action: none;
            background: var(--bs-fg-body);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);: polygon(100% 0, 100% 100%, 0 100%);
            opacity: .45;
            z-index: 1;
        }
        .text-box:hover .resize-handle,
        .text-box.editing .resize-handle { opacity: .9; }
        .resize-handle:hover { opacity: 1 !important; }
        .text-box .rendered > :last-child { margin-bottom: 0; }
        .text-box .rendered > :first-child { margin-top: 0; }

        /* Print: only the workspace pages; each one is exactly one physical A4 sheet in its own orientation. */
        @page { size: A4 portrait; margin: 0; }
        @page portrait-sheet { size: A4 portrait; margin: 0; }
        @page landscape-sheet { size: A4 landscape; margin: 0; }
        @media print {
            html, body { height: auto !important; background: none !important; }
            body { display: block !important; }
            body > header, #sidebar, .page-nav { display: none !important; }
            .app-body, .workspace {
                display: block !important;
                position: static;
                height: auto;
                padding: 0;
                overflow: visible !important;
                container-type: normal;
                background: none;
            }
            .paper {
                display: block !important;
                width: 210mm;
                height: 297mm;
                aspect-ratio: auto;
                margin: 0;
                border: 0 !important;
                box-shadow: none;
                overflow: hidden;
                break-inside: avoid;
                break-after: page;
                page: portrait-sheet;
            }
            .paper.landscape { width: 297mm; height: 210mm; page: landscape-sheet; }
            .paper:last-child { break-after: auto; }
            .text-box { border-color: transparent !important; }
            .resize-handle, .move-handle { display: none; }
        }
    </style>
</head>
<body class="d-flex flex-column vh-100">

    <!-- Main header -->
    <header class="navbar border-bottom px-2 px-md-3 gap-2">
        <div class="d-flex align-items-center gap-2">
            <button id="sidebarToggle" class="btn-text btn-icon" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle sidebar">
                <i class="bi bi-list fs-4" aria-hidden="true"></i>
            </button>
            <a class="navbar-brand m-0" href="#">Paper V2</a>
        </div>

        <div class="d-flex align-items-center gap-2">
            <button id="addPage" class="btn-solid theme-primary" type="button" title="New workspace" aria-label="New workspace">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">New</span>
            </button>

            <button id="downloadJson" class="btn-outline" type="button" title="Download JSON" aria-label="Download JSON">
                <i class="bi bi-download" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">JSON</span>
            </button>

            <button id="importJson" class="btn-outline" type="button" title="Import JSON" aria-label="Import JSON">
                <i class="bi bi-upload" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">Import</span>
            </button>
            <button id="printPages" class="btn-outline" type="button" title="Print" aria-label="Print">
                <i class="bi bi-printer" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">Print</span>
            </button>

            <input id="importFile" type="file" accept="application/json,.json" hidden>

            <div class="btn-group" role="group" aria-label="Page orientation">
                <button type="button" class="btn-outline active" data-orientation="portrait" aria-pressed="true" title="Portrait">
                    <i class="bi bi-phone" aria-hidden="true"></i>
                    <span class="d-none sm:d-inline">Portrait</span>
                </button>
                <button type="button" class="btn-outline" data-orientation="landscape" aria-pressed="false" title="Landscape">
                    <i class="bi bi-phone-landscape" aria-hidden="true"></i>
                    <span class="d-none sm:d-inline">Landscape</span>
                </button>
            </div>

            <button id="themeToggle" class="btn-outline btn-icon" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <div class="app-body d-flex flex-grow-1 overflow-hidden">

        <!-- Sidebar: drawer on mobile, collapsible column on md and up -->
        <dialog id="sidebar" class="drawer drawer-start" tabindex="-1" aria-labelledby="sidebarLabel">
            <div class="sidebar-brand d-flex align-items-center gap-2 border-bottom">
                <button id="sidebarLogo" class="sidebar-logo" type="button" aria-label="Expand sidebar" title="Expand sidebar">E</button>
                <span class="sidebar-title" id="sidebarLabel">Elements</span>
                <button id="sidebarBack" class="sidebar-back-btn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn-close md:d-none ms-auto" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body d-flex flex-column p-0">
                <nav class="sidebar-nav" aria-label="Main">
                    <div class="list-group list-group-flush">
                        <!-- Widgets -->
                        <a class="list-group-item list-group-item-action d-flex align-items-center gap-3" href="#" title="Home">
                            <i class="bi bi-grid" aria-hidden="true"></i><span class="sidebar-label">Widgets</span>
                        </a>
                        <!-- Images -->
                        <a class="list-group-item list-group-item-action d-flex align-items-center gap-3" href="#" title="Dashboard">
                            <i class="bi bi-image" aria-hidden="true"></i><span class="sidebar-label">Images</span>
                        </a>

                    </div>
                </nav>
                <!-- <div class="sidebar-user mt-auto d-flex align-items-center gap-2">
                    <span class="sidebar-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                    <span class="sidebar-user-name">mdo</span>
                </div> -->
            </div>
        </dialog>

        <main class="workspace flex-grow-1 d-flex justify-content-center align-items-center overflow-hidden">
            <div id="pages" class="d-contents"></div>

            <div class="page-nav" role="group" aria-label="Workspace navigation">
                <button id="prevPage" class="btn-solid theme-secondary btn-icon" type="button" aria-label="Previous workspace" title="Previous workspace">
                    <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
                <span id="pageCounter" class="page-counter" aria-live="polite">1 / 1</span>
                <button id="nextPage" class="btn-solid theme-secondary btn-icon" type="button" aria-label="Next workspace" title="Next workspace">
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <button id="deletePage" class="btn-solid theme-danger btn-icon mt-2" type="button" aria-label="Delete workspace" title="Delete workspace">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Bootstrap v6 JS -->
    <script type="module">
        import { Drawer } from "./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js";
        import { markdownToHtml } from "./js/markdown.bundle.js";

        const desktop = window.matchMedia("(min-width: 768px)");
        const sidebar = document.getElementById("sidebar");
        const toggle = document.getElementById("sidebarToggle");
        const sidebarLogo = document.getElementById("sidebarLogo");
        const sidebarBack = document.getElementById("sidebarBack");
        const drawer = Drawer.getOrCreateInstance(sidebar);

        // Header button: drawer on mobile, collapse column on desktop
        toggle.addEventListener("click", () => {
            if (desktop.matches) {
                sidebar.classList.toggle("sidebar-collapsed");
                syncToggle();
            } else {
                drawer.toggle();
            }
        });
        sidebarBack.addEventListener("click", () => {
            sidebar.classList.add("sidebar-collapsed");
            syncToggle();
        });
        sidebarLogo.addEventListener("click", () => {
            if (!desktop.matches) return;
            sidebar.classList.remove("sidebar-collapsed");
            syncToggle();
        });
        sidebar.addEventListener("shown.bs.drawer", syncToggle);
        sidebar.addEventListener("hidden.bs.drawer", syncToggle);
        desktop.addEventListener("change", syncToggle);

        function syncToggle() {
            const expanded = desktop.matches
                ? !sidebar.classList.contains("sidebar-collapsed")
                : sidebar.open;
            toggle.setAttribute("aria-expanded", expanded);
            toggle.setAttribute("aria-label", expanded ? "Collapse sidebar" : "Expand sidebar");
            toggle.title = expanded ? "Collapse sidebar" : "Expand sidebar";
        }
        syncToggle();

        // Color mode: light/dark, remembered; follows the system until the user chooses
        const root = document.documentElement;
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = themeToggle.querySelector(".bi");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(theme) {
            root.dataset.bsTheme = theme;
            const next = theme === "dark" ? "light" : "dark";
            themeIcon.className = `bi ${theme === "dark" ? "bi-sun" : "bi-moon-stars"}`;
            themeToggle.setAttribute("aria-label", `Switch to ${next} mode`);
            themeToggle.title = `Switch to ${next} mode`;
        }
        applyTheme(root.dataset.bsTheme);

        themeToggle.addEventListener("click", () => {
            const theme = root.dataset.bsTheme === "dark" ? "light" : "dark";
            localStorage.setItem("theme", theme);
            applyTheme(theme);
        });
        systemDark.addEventListener("change", e => {
            if (!localStorage.getItem("theme")) applyTheme(e.matches ? "dark" : "light");
        });

        // Workspaces (pages): one visible at a time, each with its own orientation
        const pagesHost = document.getElementById("pages");
        const orientationButtons = document.querySelectorAll("[data-orientation]");
        const prevPage = document.getElementById("prevPage");
        const nextPage = document.getElementById("nextPage");
        const pageCounter = document.getElementById("pageCounter");
        const deletePageBtn = document.getElementById("deletePage");
        const STATE_KEY = "workspaces";
        const pages = [];
        let current = 0;

        function getState() {
            return {
                current,
                pages: pages.map(p => ({
                    orientation: p.classList.contains("landscape") ? "landscape" : "portrait",
                    boxes: p.boxes.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h, text: b.text }))
                }))
            };
        }

        function saveState() {
            try {
                localStorage.setItem(STATE_KEY, JSON.stringify(getState()));
            } catch { /* storage unavailable or full: keep working in memory */ }
        }

        document.getElementById("downloadJson").addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(getState(), null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "workspaces.json";
            a.click();
            URL.revokeObjectURL(url);
        });

        function loadState() {
            try {
                const state = JSON.parse(localStorage.getItem(STATE_KEY));
                if (Array.isArray(state?.pages) && state.pages.length) return state;
            } catch { /* corrupt data: start fresh */ }
            return null;
        }

        function setOrientation(orientation) {
            pages[current].classList.toggle("landscape", orientation === "landscape");
            renderOrientation();
            saveState();
        }

        function renderOrientation() {
            const orientation = pages[current].classList.contains("landscape") ? "landscape" : "portrait";
            orientationButtons.forEach(b => {
                const on = b.dataset.orientation === orientation;
                b.classList.toggle("active", on);
                b.setAttribute("aria-pressed", on);
            });
        }

        function showPage(index) {
            current = index;
            pages.forEach((p, i) => p.hidden = i !== current);
            pageCounter.textContent = `${current + 1} / ${pages.length}`;
            prevPage.disabled = current === 0;
            nextPage.disabled = current === pages.length - 1;
            deletePageBtn.disabled = pages.length <= 1;
            pages.forEach((p, i) => p.setAttribute("aria-label", `Workspace ${i + 1}`));
            renderOrientation();
            saveState();
        }

        // Text boxes: geometry is stored as percentages of the page so it survives resizing/orientation changes
        const pct = v => `${(v * 100).toFixed(3)}%`;
        const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

        function createBox(page, data, edit) {
            const box = { x: 0, y: 0, w: 0.3, h: 0.12, text: "", ...data };
            const el = document.createElement("div");
            el.className = "text-box";
            page.boxes.push(box);
            page.append(el);

            const applyGeometry = () => {
                el.style.left = pct(box.x);
                el.style.top = pct(box.y);
                el.style.width = pct(box.w);
                el.style.height = pct(box.h);
            };
            // Pointer-drag helper shared by the resize and move handles; `update` gets the delta as a page fraction
            const makeDraggable = (handle, update) => {
                handle.addEventListener("pointerdown", e => {
                    e.preventDefault(); // keep the textarea focused
                    e.stopPropagation();
                    handle.setPointerCapture(e.pointerId);
                    const r = page.getBoundingClientRect();
                    const start = { ...box }, sx = e.clientX, sy = e.clientY;
                    const move = ev => {
                        update(start, (ev.clientX - sx) / r.width, (ev.clientY - sy) / r.height);
                        applyGeometry();
                    };
                    const up = () => {
                        handle.removeEventListener("pointermove", move);
                        handle.removeEventListener("pointerup", up);
                        handle.removeEventListener("pointercancel", up);
                        saveState();
                    };
                    handle.addEventListener("pointermove", move);
                    handle.addEventListener("pointerup", up);
                    handle.addEventListener("pointercancel", up);
                });
                handle.addEventListener("click", e => e.stopPropagation());
            };

            const handle = document.createElement("div");
            handle.className = "resize-handle";
            makeDraggable(handle, (s, dx, dy) => {
                box.w = clamp(s.w + dx, 0.05, 1 - box.x);
                box.h = clamp(s.h + dy, 0.03, 1 - box.y);
            });

            const mover = document.createElement("div");
            mover.className = "move-handle";
            mover.title = "Drag to move";
            mover.innerHTML = '<i class="bi bi-arrows-move" aria-hidden="true"></i>';
            makeDraggable(mover, (s, dx, dy) => {
                box.x = clamp(s.x + dx, 0, 1 - box.w);
                box.y = clamp(s.y + dy, 0, 1 - box.h);
            });

            function remove() {
                page.boxes.splice(page.boxes.indexOf(box), 1);
                el.remove();
                saveState();
            }

            function render() {
                el.classList.remove("editing");
                if (!box.text.trim()) return remove();
                const view = document.createElement("div");
                view.className = "rendered";
                view.innerHTML = markdownToHtml(box.text);
                el.replaceChildren(view, mover, handle);
                el.title = "Click to edit";
                saveState();
            }

            function editBox() {
                const ta = document.createElement("textarea");
                ta.value = box.text;
                ta.setAttribute("aria-label", "Markdown text");
                ta.placeholder = "Markdown…";
                el.classList.add("editing");
                el.title = "";
                el.replaceChildren(ta, mover, handle);
                ta.focus();
                ta.addEventListener("blur", () => {
                    box.text = ta.value;
                    render();
                });
                ta.addEventListener("keydown", e => { if (e.key === "Escape") ta.blur(); });
            }

            el.addEventListener("click", e => {
                e.stopPropagation();
                if (!el.classList.contains("editing") && !e.target.closest("a")) editBox();
            });

            applyGeometry();
            if (edit) editBox(); else render();
        }

        function createPage(orientation, boxes = []) {
            const page = document.createElement("div");
            page.className = "paper bg-body border";
            page.classList.toggle("landscape", orientation === "landscape");
            page.setAttribute("role", "region");
            page.setAttribute("aria-label", `Workspace ${pages.length + 1}`);
            page.boxes = [];
            // Clicking an empty spot opens a text box there
            page.addEventListener("click", e => {
                if (e.target !== page) return;
                const r = page.getBoundingClientRect();
                const w = 0.3, h = 0.12;
                createBox(page, {
                    x: clamp((e.clientX - r.left) / r.width, 0, 1 - w),
                    y: clamp((e.clientY - r.top) / r.height, 0, 1 - h),
                    w, h
                }, true);
            });
            pagesHost.append(page);
            pages.push(page);
            if (Array.isArray(boxes)) boxes.forEach(b => b && typeof b.text === "string" && createBox(page, b, false));
        }

        function addPage() {
            // New workspaces start with the current orientation
            createPage(pages[current]?.classList.contains("landscape") ? "landscape" : "portrait");
            showPage(pages.length - 1);
        }

        orientationButtons.forEach(btn => btn.addEventListener("click", () => setOrientation(btn.dataset.orientation)));
        document.getElementById("addPage").addEventListener("click", addPage);
        prevPage.addEventListener("click", () => showPage(current - 1));
        nextPage.addEventListener("click", () => showPage(current + 1));
        // Bootstrap's layered [hidden] rule beats any author style, so reveal every page while printing
        addEventListener("beforeprint", () => pages.forEach(p => p.hidden = false));
        addEventListener("afterprint", () => pages.forEach((p, i) => p.hidden = i !== current));
        document.getElementById("printPages").addEventListener("click", () => window.print());
        deletePageBtn.addEventListener("click", () => {
            if (pages.length <= 1 || !confirm(`Workspace ${current + 1} silinsin mi?`)) return;
            pages.splice(current, 1)[0].remove();
            showPage(Math.min(current, pages.length - 1));
        });

        function applyState(state) {
            pages.forEach(p => p.remove());
            pages.length = 0;
            state.pages.forEach(p => createPage(p?.orientation, p?.boxes));
            showPage(Math.min(Math.max(Number.isInteger(state.current) ? state.current : 0, 0), pages.length - 1));
        }

        const importInput = document.getElementById("importFile");
        document.getElementById("importJson").addEventListener("click", () => importInput.click());
        importInput.addEventListener("change", async () => {
            const file = importInput.files[0];
            importInput.value = "";
            if (!file) return;
            try {
                const state = JSON.parse(await file.text());
                if (!Array.isArray(state?.pages) || !state.pages.length) throw new Error("invalid");
                applyState(state);
            } catch {
                alert("Geçersiz JSON dosyası: içe aktarılamadı.");
            }
        });

        const saved = loadState();
        if (saved) {
            applyState(saved);
        } else {
            addPage();
        }
    </script>

</body>
</html>
