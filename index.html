<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper V2</title>

    <script src="./js/theme-init.js"></script>

    <!-- Boostrap v6 -->
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="./css/app.css" rel="stylesheet">
</head>
<body class="d-flex flex-column vh-100">

    <!-- Main header -->
    <header class="navbar border-bottom px-2 px-md-3 gap-2">
        <div class="d-flex align-items-center gap-2">
            <button id="sidebarToggle" class="btn-text btn-icon" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle sidebar">
                <i class="bi bi-list fs-4" aria-hidden="true"></i>
            </button>
            <input id="sessionName" class="form-control session-name-input" type="text" placeholder="Paper V2" maxlength="80" aria-label="Session name" autocomplete="off">
        </div>

        <div class="d-flex align-items-center gap-2">
            <button id="newSession" class="btn-solid theme-primary" type="button" title="New session" aria-label="New session">
                <i class="bi bi-file-earmark-plus" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">New session</span>
            </button>

            <button id="addPage" class="btn-outline" type="button" title="New workspace" aria-label="New workspace">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">Page</span>
            </button>

            <button id="downloadJson" class="btn-outline" type="button" title="Download JSON" aria-label="Download JSON">
                <i class="bi bi-download" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">JSON</span>
            </button>

            <button id="importJson" class="btn-outline" type="button" title="Import JSON" aria-label="Import JSON">
                <i class="bi bi-upload" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">Import</span>
            </button>
            <button id="printPages" class="btn-outline" type="button" title="Print" aria-label="Print">
                <i class="bi bi-printer" aria-hidden="true"></i>
                <span class="d-none sm:d-inline">Print</span>
            </button>

            <input id="importFile" type="file" accept="application/json,.json" hidden>

            <div class="btn-group" role="group" aria-label="Page orientation">
                <button type="button" class="btn-outline active" data-orientation="portrait" aria-pressed="true" title="Portrait">
                    <i class="bi bi-phone" aria-hidden="true"></i>
                    <span class="d-none sm:d-inline">Portrait</span>
                </button>
                <button type="button" class="btn-outline" data-orientation="landscape" aria-pressed="false" title="Landscape">
                    <i class="bi bi-phone-landscape" aria-hidden="true"></i>
                    <span class="d-none sm:d-inline">Landscape</span>
                </button>
            </div>

            <button id="themeToggle" class="btn-outline btn-icon" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <div class="app-body d-flex flex-grow-1 overflow-hidden">

        <!-- Sidebar: drawer on mobile, collapsible column on md and up -->
        <dialog id="sidebar" class="drawer drawer-start" tabindex="-1" aria-labelledby="sidebarLabel">
            <div class="sidebar-brand d-flex align-items-center gap-2 border-bottom">
                <button id="sidebarLogo" class="sidebar-logo" type="button" aria-label="Expand sidebar" title="Expand sidebar">E</button>
                <span class="sidebar-title" id="sidebarLabel">Elements</span>
                <button id="sidebarBack" class="sidebar-back-btn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
                    <i class="bi bi-chevron-left" aria-hidden="true"></i>
                </button>
                <button type="button" class="btn-close md:d-none ms-auto" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body d-flex flex-column p-0">
                <nav class="sidebar-nav" aria-label="Main">
                    <div class="list-group list-group-flush">
                        <!-- Widgets -->
                        <a class="list-group-item list-group-item-action d-flex align-items-center gap-3" href="#" title="Home">
                            <i class="bi bi-grid" aria-hidden="true"></i><span class="sidebar-label">Widgets</span>
                        </a>
                        <!-- Images -->
                        <a class="list-group-item list-group-item-action d-flex align-items-center gap-3" href="#" title="Dashboard">
                            <i class="bi bi-image" aria-hidden="true"></i><span class="sidebar-label">Images</span>
                        </a>

                    </div>
                </nav>
                <div class="sidebar-sessions mt-auto border-top">
                    <div class="sidebar-section-title sidebar-label">Sessions</div>
                    <div id="sessionList" class="list-group list-group-flush" aria-label="Sessions"></div>
                </div>
                <!-- <div class="sidebar-user mt-auto d-flex align-items-center gap-2">
                    <span class="sidebar-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                    <span class="sidebar-user-name">mdo</span>
                </div> -->
            </div>
        </dialog>

        <main class="workspace flex-grow-1 d-flex justify-content-center align-items-center overflow-hidden">
            <div id="pages" class="d-contents"></div>

            <div class="page-nav" role="group" aria-label="Workspace navigation">
                <button id="prevPage" class="btn-solid theme-secondary btn-icon" type="button" aria-label="Previous workspace" title="Previous workspace">
                    <i class="bi bi-chevron-up" aria-hidden="true"></i>
                </button>
                <span id="pageCounter" class="page-counter" aria-live="polite">1 / 1</span>
                <button id="nextPage" class="btn-solid theme-secondary btn-icon" type="button" aria-label="Next workspace" title="Next workspace">
                    <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <button id="deletePage" class="btn-solid theme-danger btn-icon mt-2" type="button" aria-label="Delete workspace" title="Delete workspace">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Bootstrap v6 JS -->
    <script type="module" src="./js/app.js"></script>

</body>
</html>
