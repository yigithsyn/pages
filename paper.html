<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js" defer></script>


    <style>
        :root {
            --page-w: 210mm;
            --page-h: 297mm;
            --page-pad: 15mm;
        }

        body {
            background: #6c757d;
        }

        #toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10mm;
            padding: 10mm 0;
        }

        .page {
            width: var(--page-w);
            height: var(--page-h);
            padding: var(--page-pad);
            background: #fff;
            box-shadow: 0 0 8px rgba(0, 0, 0, .5);
            position: relative;
            overflow: hidden;
            flex: none;
        }

        .page-content {
            height: 100%;
            overflow: hidden;
        }

        .page-number {
            position: absolute;
            bottom: 5mm;
            right: 8mm;
            font-size: 10pt;
            color: #888;
        }

        #source {
            display: none;
        }

        @media print {
            body {
                background: #fff;
            }

            #toolbar {
                display: none;
            }

            #pages {
                display: block;
                padding: 0;
            }

            .page {
                box-shadow: none;
                break-after: page;
            }
        }

        @page {
            margin: 0;
        }
    </style>
</head>

<body>
    <nav id="toolbar" class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Report</span>
        <div class="d-flex align-items-center gap-2">
            <label for="page-size" class="text-light mb-0">Page size</label>
            <select id="page-size" class="form-select form-select-sm w-auto">
                <option value="A4" selected>A4</option>
                <option value="A5">A5</option>
                <option value="A6">A6</option>
            </select>
            <label for="page-orientation" class="text-light mb-0">Orientation</label>
            <select id="page-orientation" class="form-select form-select-sm w-auto">
                <option value="portrait" selected>Portrait</option>
                <option value="landscape">Landscape</option>
            </select>
            <button id="print" class="btn btn-sm btn-outline-light">Print</button>
        </div>
    </nav>

    <main id="pages"></main>

    <!-- Source sections; paginated into pages by the script below. -->
    <div id="source">
        <section>
        </section>

        <section>
        </section>

        <section>
        </section>

        <section>
        </section>

        <section>
        </section>

        <section>
        </section>

        <section>
        </section>

        <script>
        </script>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        const SIZES = { A4: ['210mm', '297mm'], A5: ['148mm', '210mm'], A6: ['105mm', '148mm'] };

        function newPage($pages) {
            const $content = $('<div class="page-content"></div>');
            const $page = $('<div class="page"></div>').append($content);
            $pages.append($page);
            return $content;
        }

        function paginate() {
            let [w, h] = SIZES[$('#page-size').val()];
            if ($('#page-orientation').val() === 'landscape') [w, h] = [h, w];
            $('#page-style').remove();
            $('<style id="page-style"></style>').text('@page { size: ' + w + ' ' + h + '; margin: 0; }').appendTo('head');
            document.documentElement.style.setProperty('--page-w', w);
            document.documentElement.style.setProperty('--page-h', h);

            const $pages = $('#pages').empty();
            let $content = newPage($pages);

            const overflows = () => $content[0].scrollHeight > $content[0].clientHeight;

            $('#source > section').each(function () {
                const $section = $(this).clone();
                $content.append($section);
                if (!overflows()) return;

                // Doesn't fit: retry on a fresh page.
                if ($content.children().length > 1) {
                    $content = newPage($pages);
                    $content.append($section);
                    if (!overflows()) return;
                }

                // Taller than a whole page: split its child elements across pages.
                const $children = $section.children().detach();
                let $shell = $section;
                $children.each(function () {
                    $shell.append(this);
                    if (overflows() && $shell.children().length > 1) {
                        $content = newPage($pages);
                        $shell = $section.clone().empty();
                        $content.append($shell);
                        $shell.append(this);
                    }
                });
            });

            $pages.children('.page').each(function (i) {
                $(this).append('<div class="page-number">' + (i + 1) + '</div>');
            });
        }

        $(function () {
            // Persist page size and orientation across reloads.
            $('#page-size, #page-orientation').each(function () {
                const saved = localStorage.getItem(this.id);
                if (saved) $(this).val(saved);
            }).on('change', function () {
                localStorage.setItem(this.id, $(this).val());
                paginate();
            });
            $('#print').on('click', () => window.print());
            paginate();
        });
    </script>

</body>
</html>
